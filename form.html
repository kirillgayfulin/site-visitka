<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site-visitka Кирилл Гайфулин</title>
</head>
<body>
    <div id="wrapper">
        <header class="clearfix">
            <a href="index.html" id="logo"><span class="pink">Digital </span><i> решения</i></a>
            <nav id="mainnav">
                <ul>
                    <li><a href="uslugi.html" class="footer__block">УСЛУГИ</a></li>
                    <li><a href="index copy.html" class="footer__block">О НАС</a></li>
                    <li><a href="contacts.html" class="footer__block"> КЛИЕНТЫ</a></li>
                    <li><a href="index copy 2.html" class="footer__block"> КОНТАКТЫ</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <form action="" id="contact-form">
                <div class="form_item">
                    <label for="topic">Тема</label><br>
                    <select name="topic" id="topic" required>
                        <option value="1">Заказать услугу</option>
                        <option value="2">Оставить отзыв/замечание</option>
                        <option value="3">Предложить сотрудничество</option>
                        <option value="4">Другое</option>
                    </select>
                </div>
                <div class="form_item">
                    <label for="name">Имя</label><br>
                    <input name="name" id="name" type="text" placeholder="Введите ваше имя" required>
                </div>
                <div class="form_item">
                    <label for="e-mail">E-mail</label><br>
                    <input name="e-mail" id="e-mail" type="email" placeholder="example@mail.ru" required>
                </div>
                <div class="form_item">
                    <label for="textarea"><i>Текст сообщения</i></label><br>
                    <textarea id="textarea" name="message" rows="10" placeholder="Ваше сообщение..." required></textarea>
                </div>
                <div class="form_item">
                    <input type="submit" value="Отправить">
                </div>
            </form>
        </main>
    </div>
    <footer>
        <a href="form.html"><p class="footer__block">Написать нам ▲</p></a>
        <p class="footer__block">&copy; Digital решения</p>
        <div class="footer__icons">
            <img class="footer__img" src="img/mailru.png" alt="Mail.ru">
            <img class="footer__img" src="img/ok.png" alt="Одноклассники">
            <img class="footer__img" src="img/vk.png" alt="ВКонтакте">
        </div>
    </footer>
</body>
</html>
